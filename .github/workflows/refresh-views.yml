# Relevé horaire des vues (l'offre gratuite de Vercel limite ses crons à 1 par jour).
# À configurer dans GitHub → Settings → Secrets and variables → Actions :
#   APP_URL     : https://ton-app.vercel.app
#   CRON_SECRET : la même valeur que sur Vercel
name: Relevé des vues

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler /api/cron/refresh-views
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Secrets APP_URL / CRON_SECRET non configurés : rien à faire."
            exit 0
          fi
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/refresh-views"
